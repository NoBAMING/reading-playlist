const makeCoverFallback = (title, genre, palette = []) => {
  const bg = palette?.[0] || '#243447';
  const accent = palette?.[1] || '#d7b56d';
  const safeTitle = String(title || '리딩플리').replace(/[<>&]/g, '');
  const safeGenre = String(genre || '추천 도서').replace(/[<>&]/g, '');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${bg}"/><stop offset="1" stop-color="#101820"/></linearGradient></defs><rect width="600" height="900" fill="url(#g)"/><rect x="35" y="35" width="530" height="830" rx="18" fill="none" stroke="${accent}" stroke-opacity=".75" stroke-width="3"/><circle cx="300" cy="300" r="150" fill="${accent}" opacity=".13"/><path d="M300 170 C210 225 220 360 300 420 C380 360 390 225 300 170Z" fill="none" stroke="${accent}" stroke-width="5" opacity=".8"/><text x="300" y="590" text-anchor="middle" fill="#fff" font-size="52" font-family="sans-serif" font-weight="700">${safeTitle}</text><text x="300" y="660" text-anchor="middle" fill="${accent}" font-size="26" font-family="sans-serif">${safeGenre}</text><text x="300" y="790" text-anchor="middle" fill="#ffffff" opacity=".65" font-size="22" font-family="sans-serif" letter-spacing="8">READING PLAYLIST</text></svg>`;
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
};

function App() {
  const [activeTab, setActiveTab] = useState('scan'); // 'scan' | 'playlist' | 'shorts'
  const [selectedImage, setSelectedImage] = useState(null);
  const [isScanning, setIsScanning] = useState(false);
  const [scanProgress, setScanProgress] = useState(0);
  const [analyzedData, setAnalyzedData] = useState(null);

  // 사용자 직접 편집 상태 및 커스텀 무드 상태
  const [isEditingMeta, setIsEditingMeta] = useState(false);
  const [editForm, setEditForm] = useState({
    title: '',
    author: '',
    genre: '',
    playlistTitle: '',
    quotes: '',
    moodTags: []
  });
  const [newTagInput, setNewTagInput] = useState('');
  const [selectedMoodId, setSelectedMoodId] = useState(null);

  // 재생 및 오디오 상태
  const [isPlaying, setIsPlaying] = useState(false);
  const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
  const [volume, setVolume] = useState(80);
  const [audioProgress, setAudioProgress] = useState(25);
  
  // 앰비언트 노이즈 볼륨 (0 ~ 100)
  const [ambientVolumes, setAmbientVolumes] = useState({
    rain: 40,
    fire: 30,
    cafe: 0,
    page: 20,
    wind: 15,
    ocean: 0
  });

  // 오디오 합성용 Web Audio API 참조
  const audioCtxRef = useRef(null);
  const masterGainRef = useRef(null);
  const ambientGainsRef = useRef({});
  const melodyTimerRef = useRef(null);

  // 오디오 컨텍스트 및 앰비언트 노이즈 초기화
  const initAudioEngine = () => {
    if (audioCtxRef.current) return;
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    audioCtxRef.current = ctx;

    const masterGain = ctx.createGain();
    masterGain.gain.value = volume / 100;
    masterGain.connect(ctx.destination);
    masterGainRef.current = masterGain;

    // 앰비언트 노이즈 생성 (화이트/핑크/브라운 노이즈 버퍼)
    const bufferSize = ctx.sampleRate * 3;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    let lastOut = 0.0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      output[i] = (lastOut + (0.02 * white)) / 1.02;
      lastOut = output[i];
      output[i] *= 3.5;
    }

    // 각 앰비언트 채널별 필터 및 게인 노드 설정 (6종)
    const channels = [
      { id: 'rain', freq: 1200, type: 'bandpass', scale: 0.13 },
      { id: 'fire', freq: 340, type: 'lowpass', scale: 0.26 },
      { id: 'cafe', freq: 820, type: 'peaking', scale: 0.09 },
      { id: 'page', freq: 2600, type: 'highpass', scale: 0.045 },
      { id: 'wind', freq: 520, type: 'bandpass', scale: 0.16 },
      { id: 'ocean', freq: 220, type: 'lowpass', scale: 0.30 }
    ];

    channels.forEach(ch => {
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = ch.type;
      filter.frequency.value = ch.freq;
      if (ch.id === 'wind') filter.Q.value = 3.5;

      const gain = ctx.createGain();
      gain.gain.value = 0;

      // 파도 소리(ocean)와 밤바람(wind)에 은은한 LFO 모듈레이션 추가
      if (ch.id === 'ocean' || ch.id === 'wind') {
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.frequency.value = ch.id === 'ocean' ? 0.12 : 0.18;
        lfoGain.gain.value = ch.id === 'ocean' ? 110 : 180;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();
      }

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start();

      ambientGainsRef.current[ch.id] = { node: gain, scale: ch.scale };
    });
  };

  // 무드별 맞춤형 감성 피아노/패드/신스 음색 재생 함수
  const playSoftNote = (freq, options = {}) => {
    const ctx = audioCtxRef.current;
    if (!ctx || !masterGainRef.current) return;

    const { wave = 'sine', subRatio = 0.5, release = 3.2 } = options;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const filter = ctx.createBiquadFilter();
    const noteGain = ctx.createGain();

    // 배음이 풍부한 파형(sawtooth/triangle)은 로우패스 필터로 부드럽게 다듬음
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(wave === 'sawtooth' ? 950 : 1800, now);

    osc.type = wave;
    osc.frequency.setValueAtTime(freq, now);
    
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(freq * subRatio, now);

    const peakGain = wave === 'sawtooth' ? 0.08 : 0.13;
    noteGain.gain.setValueAtTime(0.001, now);
    noteGain.gain.exponentialRampToValueAtTime(peakGain, now + 0.35);
    noteGain.gain.exponentialRampToValueAtTime(0.0001, now + release);

    osc.connect(filter);
    osc2.connect(filter);
    filter.connect(noteGain);
    noteGain.connect(masterGainRef.current);

    osc.start(now);
    osc2.start(now);
    osc.stop(now + release + 0.1);
    osc2.stop(now + release + 0.1);
  };

  // 재생/일시정지 및 트랙 변경 시 멜로디 & 앰비언트 동기화
  useEffect(() => {
    if (isPlaying) {
      initAudioEngine();
      if (audioCtxRef.current?.state === 'suspended') {
        audioCtxRef.current.resume();
      }

      // 앰비언트 노이즈 볼륨 적용
      Object.entries(ambientVolumes).forEach(([key, val]) => {
        const ch = ambientGainsRef.current[key];
        if (ch && audioCtxRef.current) {
          const targetGain = (val / 100) * ch.scale;
          ch.node.gain.setTargetAtTime(targetGain, audioCtxRef.current.currentTime, 0.1);
        }
      });

      // 선택된 무드 또는 트랙 인덱스에 맞는 스케일/음색/템포 설정
      const activeMood = MOOD_PRESETS.find(m => m.id === selectedMoodId) 
        || MOOD_PRESETS[currentTrackIndex % MOOD_PRESETS.length];
      
      const currentScale = activeMood.scale;
      const noteOptions = {
        wave: activeMood.wave,
        subRatio: activeMood.subRatio,
        release: activeMood.release
      };
      let step = 0;

      // 즉시 첫 음 재생 후 주기적 연주 (자연스러운 아르페지오 패턴)
      playSoftNote(currentScale[0], noteOptions);
      melodyTimerRef.current = setInterval(() => {
        step = (step + 1) % currentScale.length;
        const note = currentScale[step];
        playSoftNote(note, noteOptions);
        setAudioProgress(prev => (prev >= 100 ? 0 : prev + 1.5));
      }, activeMood.tempo);

    } else {
      if (melodyTimerRef.current) clearInterval(melodyTimerRef.current);
      // 일시정지 시 앰비언트 음소거
      Object.values(ambientGainsRef.current).forEach(ch => {
        if (ch && audioCtxRef.current) {
          ch.node.gain.setTargetAtTime(0, audioCtxRef.current.currentTime, 0.1);
        }
      });
    }

    return () => {
      if (melodyTimerRef.current) clearInterval(melodyTimerRef.current);
    };
  }, [isPlaying, currentTrackIndex, analyzedData, selectedMoodId]);

  // 마스터 볼륨 실시간 반영
  useEffect(() => {
    if (masterGainRef.current && audioCtxRef.current) {
      masterGainRef.current.gain.setTargetAtTime(volume / 100, audioCtxRef.current.currentTime, 0.05);
    }
  }, [volume]);

  // 앰비언트 슬라이더 조작 시 실시간 소리 크기 변경
  useEffect(() => {
    if (!isPlaying || !audioCtxRef.current) return;
    Object.entries(ambientVolumes).forEach(([key, val]) => {
      const ch = ambientGainsRef.current[key];
      if (ch) {
        const targetGain = (val / 100) * ch.scale;
        ch.node.gain.setTargetAtTime(targetGain, audioCtxRef.current.currentTime, 0.1);
      }
    });
  }, [ambientVolumes, isPlaying]);

  // 앰비언트 볼륨 조절 핸들러
  const handleVolumeChange = (type, val) => {
    setAmbientVolumes(prev => ({ ...prev, [type]: val }));
  };

  // 편집 모드 시작
  const startEditingMeta = () => {
    if (!analyzedData) return;
    setEditForm({
      title: analyzedData.title,
      author: analyzedData.author,
      genre: analyzedData.genre,
      playlistTitle: analyzedData.playlistTitle,
      quotes: analyzedData.quotes || '',
      moodTags: [...analyzedData.moodTags]
    });
    setIsEditingMeta(true);
  };

  // 편집 내용 저장
  const saveEditedMeta = () => {
    setAnalyzedData(prev => ({
      ...prev,
      title: editForm.title.trim() || prev.title,
      author: editForm.author.trim() || prev.author,
      genre: editForm.genre.trim() || prev.genre,
      playlistTitle: editForm.playlistTitle.trim() || prev.playlistTitle,
      quotes: editForm.quotes.trim(),
      moodTags: editForm.moodTags
    }));
    setIsEditingMeta(false);
  };

  // 태그 추가/삭제
  const handleAddTag = (e) => {
    e.preventDefault();
    const cleaned = newTagInput.trim().replace(/^#/, '');
    if (cleaned && !editForm.moodTags.includes(cleaned)) {
      setEditForm(prev => ({ ...prev, moodTags: [...prev.moodTags, cleaned] }));
    }
    setNewTagInput('');
  };

  const handleRemoveTag = (tagToRemove) => {
    setEditForm(prev => ({
      ...prev,
      moodTags: prev.moodTags.filter(t => t !== tagToRemove)
    }));
  };

  // 사용자가 직접 플레이리스트 분위기(무드) 지정
  const applyCustomMood = (preset) => {
    setSelectedMoodId(preset.id);
    setAmbientVolumes(preset.ambient);
    setAnalyzedData(prev => ({
      ...prev,
      playlistTitle: `${prev.title} — ${preset.label} 믹스`,
      tracks: preset.tracks
    }));
    setCurrentTrackIndex(0);
    setIsPlaying(true);
  };

  // 1. 책 이미지 선택 및 스캔 시뮬레이션
  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        startScanProcess(event.target.result, file.name.replace(/\.[^/.]+$/, ""));
      };
      reader.readAsDataURL(file);
    }
  };

  const selectSampleBook = (sample) => {
    setSelectedImage(sample.cover);
    startScanProcess(sample.cover, sample);
  };

  const startScanProcess = (imageSrc, sampleObj = null) => {
    setSelectedImage(imageSrc);
    setIsScanning(true);
    setScanProgress(0);

    let current = 0;
    const interval = setInterval(() => {
      current += 10;
      setScanProgress(current);
      if (current >= 100) {
        clearInterval(interval);
        setTimeout(() => {
          setIsScanning(false);
          // 스캔 완료 시 분석 데이터 할당
          if (typeof sampleObj === 'object' && sampleObj !== null) {
            setAnalyzedData(sampleObj);
            setAmbientVolumes(sampleObj.ambientPreset);
          } else {
            // 사용자 커스텀 사진일 때 임의 분석 데이터 생성
            const customData = {
            id: 'custom-' + Date.now(),
            title: sampleObj || '업로드된 책 표지',
            author: '알 수 없는 저자',
            genre: '감성 에세이 / 문학',
            cover: imageSrc,
            moodTags: ['비오는 서점', '새벽 감성', '아날로그 텍스처', '서정적'],
            palette: ['#121212', '#1DB954', '#535353'],
            playlistTitle: '표지의 색감과 분위기를 담은 리딩플리 그린 믹스',
            ambientPreset: { rain: 60, fire: 20, cafe: 30, page: 40 },
            tracks: [
              { id: 1, title: 'Analog Raindrops', artist: '리딩플리 AI', duration: '3:20', mood: '감성' },
              { id: 2, title: 'Chapter 1: Dawn', artist: 'Silent Reader', duration: '4:15', mood: '잔잔' },
              { id: 3, title: 'Coffee and Dust', artist: 'Vibe Synth', duration: '3:05', mood: '몰입' },
              { id: 4, title: 'Epilogue Memories', artist: 'Storyteller', duration: '4:30', mood: '아련함' }
            ],
            quotes: "책장을 넘길 때마다 조용히 퍼지는 우리만의 이야기가 시작됩니다."
          };
            setAnalyzedData(customData);
            setAmbientVolumes(customData.ambientPreset);
          }
          setSelectedMoodId(null);
          setIsEditingMeta(false);
          setCurrentTrackIndex(0);
          setIsPlaying(true);
          setActiveTab('playlist');
        }, 500);
      }
    }, 150);
  };

  return (
    <div className="min-h-screen bg-[#121212] text-slate-100 font-sans flex flex-col items-center justify-start pb-24 selection:bg-[#1DB954] selection:text-black">

      <header className="w-full max-w-5xl px-6 py-4 flex items-center justify-between border-b border-[#282828] sticky top-0 z-40 bg-[#121212]/90 backdrop-blur-md">
        <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => setActiveTab('scan')}>
          <div className="w-10 h-10 rounded-full bg-[#1DB954] flex items-center justify-center shadow-lg shadow-[#1DB954]/20 group-hover:scale-105 transition-transform">
            <SpotiBookLogo className="w-6 h-6" color="#000000" />
          </div>
          <div>
            <h1 className="text-xl font-black tracking-tight text-white flex items-center gap-1">
              리딩플리 <span className="w-2 h-2 rounded-full bg-[#1DB954] inline-block"></span>
            </h1>
            <p className="text-xs text-[#b3b3b3]">나만 없어 내 독서 플레이리스트</p>
          </div>
        </div>

        {/* Tab Navigation */}
        {analyzedData && (
          <nav className="flex space-x-1 bg-[#181818] p-1.5 rounded-full border border-[#282828]">
            <button
              onClick={() => setActiveTab('scan')}
              className={`px-4 py-1.5 text-xs font-bold rounded-full transition-all ${
                activeTab === 'scan' ? 'bg-[#1DB954] text-black shadow-md' : 'text-[#b3b3b3] hover:text-white'
              }`}
            >
              표지 스캔
            </button>
            <button
              onClick={() => setActiveTab('playlist')}
              className={`px-4 py-1.5 text-xs font-bold rounded-full transition-all flex items-center gap-1.5 ${
                activeTab === 'playlist' ? 'bg-[#1DB954] text-black shadow-md' : 'text-[#b3b3b3] hover:text-white'
              }`}
            >
              <Music className="w-3.5 h-3.5" />
              플레이리스트
            </button>
            <button
              onClick={() => setActiveTab('shorts')}
              className={`px-4 py-1.5 text-xs font-bold rounded-full transition-all flex items-center gap-1.5 ${
                activeTab === 'shorts' ? 'bg-[#1DB954] text-black shadow-md' : 'text-[#b3b3b3] hover:text-white'
              }`}
            >

          </nav>
        )}
      </header>

      {/* Main Container */}
      <main className="w-full max-w-5xl px-4 mt-6 flex-1">
        {/* TAB 1: 책 표지 업로드 및 스캔 */}
        {activeTab === 'scan' && (
          <div className="space-y-8 animate-fadeIn">
            {/* Hero Section */}
            <div className="text-center max-w-2xl mx-auto space-y-3 pt-4">
              <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-[#1DB954]/10 text-[#1DB954] border border-[#1DB954]/20">
                <Sparkles className="w-3.5 h-3.5" /> Create my own playlist
              </span>
              <h2 className="text-3xl sm:text-4xl font-black tracking-tight text-white">
                읽고 있는 <span className="text-[#1DB954]">책 표지</span>를 스캔하세요
              </h2>
              <p className="text-[#b3b3b3] text-sm sm:text-base">
                AI가 표지의 톤앤매너를 스캔해 오직 나만을 위한 스포티파이 스타일 독서 음악과 숏폼 비주얼 카드를 만듭니다.
              </p>
            </div>

            {/* Upload Box */}
            <div className="max-w-xl mx-auto">
              <div className="relative group border-2 border-dashed border-[#282828] hover:border-[#1DB954] transition-all rounded-3xl bg-[#181818] p-8 text-center flex flex-col items-center justify-center min-h-[320px] overflow-hidden">
                
                {selectedImage && isScanning ? (
                  /* Scan Processing Overlay */
                  <div className="absolute inset-0 z-20 bg-[#121212]/95 flex flex-col items-center justify-center p-6 space-y-4">
                    <div className="relative w-44 h-60 rounded-xl overflow-hidden shadow-2xl border border-[#1DB954]/50">
                      <img src={selectedImage} alt="Scanning Cover" className="w-full h-full object-cover filter brightness-90" />
                      {/* Laser Scanner Line */}
                      <div 
                        className="absolute inset-x-0 h-1 bg-[#1DB954] shadow-[0_0_15px_#1DB954] transition-all duration-75"
                        style={{ top: `${scanProgress}%` }}
                      />
                      <div className="absolute inset-0 bg-[#1DB954]/10 backdrop-contrast-125"></div>

                  </div>

                  {/* Ocean Waves */}
                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between text-xs">
                      <span className="flex items-center gap-1.5 text-slate-300 font-bold">
                        <Waves className={`w-4 h-4 ${ambientVolumes.ocean > 0 ? 'text-[#1DB954]' : 'text-[#888888]'}`} />
                        잔잔한 파도 (Ocean Waves)
                      </span>
                      <span className="text-[#888888]">{ambientVolumes.ocean || 0}%</span>
                    </div>
                    <input 
                      type="range" 
                      min="0" 
                      max="100" 
                      value={ambientVolumes.ocean || 0}
                      onChange={(e) => handleVolumeChange('ocean', Number(e.target.value))}
                      className="w-full accent-[#1DB954] bg-[#282828] h-1.5 rounded-lg cursor-pointer"
                    />
                  </div>
                </div>

                <div className="pt-2 text-center">
                  <p className="text-[11px] text-[#b3b3b3]">
                    🎧 이어폰을 착용하시면 더 선명한 스포티파이 감성의 공간감을 느끼실 수 있습니다.
                  </p>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* TAB 3: 숏폼 미리보기 */}
        {activeTab === 'shorts' && analyzedData && (
          <div className="space-y-6 animate-fadeIn">
            <div className="text-center max-w-lg mx-auto">
              <h2 className="text-2xl font-black text-white flex items-center justify-center gap-2">
                <Smartphone className="w-6 h-6 text-[#1DB954]" /> SNS 공유용 숏폼 비주얼 카드
              </h2>
              <p className="text-xs text-[#b3b3b3] mt-1">
                9:16 스포티파이 캔버스/릴스 감성 세로형 카드로 독서 무드를 자랑해 보세요.
              </p>
            </div>

            {/* 9:16 Aspect Ratio Shorts Preview Device */}
            <div className="flex justify-center">
              <div className="relative w-[310px] h-[550px] sm:w-[340px] sm:h-[600px] rounded-[36px] border-4 border-[#282828] bg-[#121212] overflow-hidden shadow-2xl flex flex-col justify-between p-5 text-white select-none">
                
                {/* Background Art with Blur */}
                <div 
                  className="absolute inset-0 bg-cover bg-center filter blur-xl scale-125 opacity-30 transition-transform duration-10000 animate-pulse"
                  style={{ backgroundImage: `url(${analyzedData.cover})` }}
                />
                <div className="absolute inset-0 bg-gradient-to-b from-black/70 via-black/30 to-black/95"></div>

                {/* Shorts Top Bar */}
                <div className="relative z-10 flex items-center justify-between text-xs pt-2">
                  <div className="flex items-center gap-2">
                    <div className="w-7 h-7 rounded-full bg-[#1DB954] flex items-center justify-center font-black text-[9px] text-black">
                      <SpotiBookLogo className="w-4 h-4" color="#000000" />
                    </div>
                    <span className="font-bold text-white text-xs">@readingplaylist</span>
                  </div>
                  <span className="px-2.5 py-0.5 rounded-full text-[10px] bg-[#1DB954] text-black font-extrabold uppercase tracking-wider">
                    READING VIBE
                  </span>
                </div>

                {/* Center Book Cover & Quote Card in Shorts */}
                <div className="relative z-10 flex-1 flex flex-col items-center justify-center space-y-4 my-auto py-4">
                  <div className="w-36 sm:w-40 aspect-[2/3] rounded-xl overflow-hidden shadow-2xl border border-white/20 transform hover:scale-105 transition-transform duration-300">
                    <img src={analyzedData.cover} alt={analyzedData.title} onError={(e) => { e.currentTarget.onerror = null; e.currentTarget.src = makeCoverFallback(analyzedData.title, analyzedData.genre, analyzedData.palette); }} className="w-full h-full object-cover" />
                  </div>
                  <div className="text-center px-2 space-y-1">
                    <h3 className="font-black text-base sm:text-lg text-white drop-shadow-md line-clamp-1">{analyzedData.title}</h3>
                    <p className="text-xs text-[#1DB954] font-bold">{analyzedData.author}</p>
                    {analyzedData.quotes && (
                      <p className="text-[11px] text-slate-200/90 pt-2 leading-tight max-w-[240px] mx-auto bg-[#181818]/80 p-3 rounded-xl border border-white/10 backdrop-blur-sm">
                        "{analyzedData.quotes}"
                      </p>
                    )}
                  </div>
                </div>

                {/* Shorts Bottom Details & Spotify Wave */}
                <div className="relative z-10 space-y-3 pb-2">
                  {/* Audio Equalizer & Track Info */}
                  <div className="flex items-center gap-3 bg-[#181818]/90 backdrop-blur-md rounded-2xl p-2.5 border border-white/10">
                    <div className="w-8 h-8 rounded-full bg-[#1DB954] flex items-center justify-center text-black font-bold animate-spin" style={{ animationDuration: '5s' }}>
                      <Disc className="w-5 h-5" />
                    </div>
                    <div className="flex-1 overflow-hidden">
                      <p className="text-xs font-bold text-white truncate">
                        {analyzedData.tracks[currentTrackIndex]?.title || analyzedData.playlistTitle}
                      </p>
                      <p className="text-[10px] text-[#1DB954] truncate font-medium">
                        {analyzedData.genre} · 리딩플리 AI
                      </p>
                    </div>
                    {/* Spotify Style Equalizer */}
                    <div className="flex items-end gap-0.5 h-4 px-1">
                      <div className="w-1 bg-[#1DB954] h-full animate-pulse"></div>
                      <div className="w-1 bg-[#1DB954] h-2/3 animate-pulse delay-75"></div>
                      <div className="w-1 bg-[#1DB954] h-4/5 animate-pulse delay-150"></div>
                    </div>
                  </div>

                  {/* Bottom Hashtags */}
                  <div className="flex flex-wrap gap-1 text-[10px] text-[#b3b3b3] px-1 font-semibold">
                    <span>#리딩플리</span>
                    <span>#독서플레이리스트</span>
                    <span>#{analyzedData.genre.replace(/\s+/g, '')}</span>
                  </div>
                </div>

                {/* Floating Social Interaction Icons */}
                <div className="absolute right-3 bottom-20 z-20 flex flex-col items-center space-y-4 text-white">
                  <button className="flex flex-col items-center gap-0.5 group">
                    <div className="w-9 h-9 rounded-full bg-[#181818]/80 backdrop-blur-md flex items-center justify-center group-hover:bg-[#1DB954] transition-colors">
                      <Heart className="w-5 h-5 text-white group-hover:text-black" />
                    </div>
                    <span className="text-[10px] text-[#b3b3b3]">1.2k</span>
                  </button>
                  <button className="flex flex-col items-center gap-0.5 group">
                    <div className="w-9 h-9 rounded-full bg-[#181818]/80 backdrop-blur-md flex items-center justify-center group-hover:bg-[#1DB954] transition-colors">
                      <Share2 className="w-5 h-5 text-white group-hover:text-black" />
                    </div>
                    <span className="text-[10px] text-[#b3b3b3]">공유</span>
                  </button>
                </div>

              </div>
            </div>

            {/* Export / Download Buttons */}
            <div className="flex justify-center gap-3 pt-2">
              <button className="px-6 py-2.5 rounded-full bg-[#1DB954] hover:bg-[#1ed760] text-black font-extrabold text-xs flex items-center gap-2 shadow-lg shadow-[#1DB954]/20 transition-all">
                <Download className="w-4 h-4" /> 숏폼 카드 비디오 저장
              </button>
              <button className="px-6 py-2.5 rounded-full bg-[#282828] hover:bg-[#3e3e3e] text-white font-bold text-xs flex items-center gap-2 transition-all">
                <Share2 className="w-4 h-4" /> SNS에 공유하기
              </button>
            </div>
          </div>
        )}
      </main>

      {/* Persistent Spotify Style Audio Player Bar */}
      {analyzedData && (
        <div className="fixed bottom-0 inset-x-0 z-50 bg-[#000000] border-t border-[#282828] px-4 py-3 shadow-2xl">
          <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
            
            {/* Left Track Info */}
            <div className="flex items-center space-x-3 w-1/3 min-w-0">
              <img 
                src={analyzedData.cover} 
                alt="Cover" 
                className="w-12 h-12 rounded-md object-cover border border-[#282828]"
              />
              <div className="min-w-0">
                <h4 className="text-xs font-bold text-white truncate hover:underline cursor-pointer">
                  {analyzedData.tracks[currentTrackIndex]?.title}
                </h4>
                <p className="text-[11px] text-[#b3b3b3] truncate">
                  {analyzedData.tracks[currentTrackIndex]?.artist}
                </p>
              </div>
            </div>

            {/* Middle Playback Controls */}
            <div className="flex flex-col items-center w-1/3">
              <div className="flex items-center space-x-5">
                <button 
                  onClick={() => setCurrentTrackIndex(prev => (prev > 0 ? prev - 1 : analyzedData.tracks.length - 1))}
                  className="text-[#b3b3b3] hover:text-white transition-colors"
                >
                  <SkipBack className="w-4 h-4" />
                </button>
                <button 
                  onClick={() => setIsPlaying(!isPlaying)}
                  className="w-8 h-8 rounded-full bg-white hover:scale-105 text-black flex items-center justify-center transition-transform active:scale-95"
                >
                  {isPlaying ? <Pause className="w-4 h-4 fill-black text-black" /> : <Play className="w-4 h-4 fill-black text-black ml-0.5" />}
                </button>
                <button 
                  onClick={() => setCurrentTrackIndex(prev => (prev < analyzedData.tracks.length - 1 ? prev + 1 : 0))}
                  className="text-[#b3b3b3] hover:text-white transition-colors"
                >
                  <SkipForward className="w-4 h-4" />
                </button>
              </div>

              {/* Seek Bar */}
              <div className="w-full max-w-xs flex items-center gap-2 mt-1.5">
                <span className="text-[10px] text-[#b3b3b3]">0:45</span>
                <input 
                  type="range" 
                  min="0" 
                  max="100" 
                  value={audioProgress}
                  onChange={(e) => setAudioProgress(Number(e.target.value))}
                  className="w-full accent-[#1DB954] bg-[#535353] h-1 rounded-lg cursor-pointer"
                />
                <span className="text-[10px] text-[#b3b3b3]">{analyzedData.tracks[currentTrackIndex]?.duration}</span>
              </div>
            </div>

            {/* Right Volume & Ambient Indicator */}
            <div className="flex items-center justify-end space-x-3 w-1/3">
              <div className="hidden sm:flex items-center space-x-2">
                <button onClick={() => setVolume(volume > 0 ? 0 : 80)} className="text-[#b3b3b3] hover:text-white">
                  {volume === 0 ? <VolumeX className="w-4 h-4" /> : <Volume2 className="w-4 h-4" />}
                </button>
                <input 
                  type="range" 
                  min="0" 
                  max="100" 
                  value={volume}
                  onChange={(e) => setVolume(Number(e.target.value))}
                  className="w-20 accent-[#1DB954] bg-[#535353] h-1 rounded-lg cursor-pointer"
                />
              </div>

              <div className="flex items-center gap-1.5 text-[10px] text-[#1DB954] bg-[#1DB954]/10 px-2.5 py-1 rounded-full border border-[#1DB954]/20 font-bold">
                <Radio className="w-3 h-3 text-[#1DB954] animate-pulse" />
                <span>리딩 믹스</span>
              </div>
            </div>

          </div>
        </div>
      )}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
